name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    # Newest Apple Silicon runner. Bump this when GitHub ships a newer one.
    runs-on: macos-26
    steps:
      # First, so that toolchain differences between CI and local machines are easy to spot.
      - name: Show toolchain versions
        run: |
          swift --version
          swift format --version

      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Build tests
        id: build-tests
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # Three groups, so that a test that generates heavy load never runs at the same time as a
      # test that asserts latency (docs/decisions/0018-test-groups.md). Each group runs once the
      # tests are built, even if an earlier group failed, and the last step fails unless every
      # test ran in exactly one group.
      - name: Test the general group, in parallel
        run: scripts/test-groups.sh run general "$RUNNER_TEMP/test-results"

      - name: Test the latency group, one test at a time
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: scripts/test-groups.sh run latency "$RUNNER_TEMP/test-results"

      - name: Test the load group, one test at a time
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: scripts/test-groups.sh run load "$RUNNER_TEMP/test-results"

      - name: Check that every test ran in exactly one group
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        run: scripts/test-groups.sh check "$RUNNER_TEMP/test-results"

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Sign mawd
        run: ./scripts/sign-dev.sh

  app:
    name: Terminal app
    # Same runner as the build job. The app package needs the Metal Toolchain for SwiftTerm's
    # shader, so it is installed in this job only (docs/decisions/0008-app-package.md).
    runs-on: macos-26
    steps:
      # The SDK decides some of SwiftUI's behavior, in the app and in the tests' runner alike
      # (docs/decisions/0019-swiftui-behavior-in-app-tests.md).
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          for runner in "$(xcode-select -p)/usr/bin/xctest" \
            "$(dirname "$(xcrun -f swift)")/../libexec/swift/pm/swiftpm-testing-helper"; do
            if [ -f "$runner" ]; then
              echo "$(basename "$runner") linked with SDK" \
                "$(xcrun vtool -show-build "$runner" | awk '$1 == "sdk" { print $2; exit }')"
            fi
          done
          swift format --version

      - name: Check out
        uses: actions/checkout@v7

      - name: Install the Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent MetalToolchain
          xcrun metal --version

      - name: Build MawTerminalKit
        working-directory: App/MawTerminalKit
        run: swift build -Xswiftc -warnings-as-errors

      # Every test of this package runs on the main actor, so tests that bound a duration run
      # after the others, one at a time, as the root package's latency group does
      # (docs/decisions/0018-test-groups.md).
      - name: Test MawTerminalKit
        working-directory: App/MawTerminalKit
        run: |
          swift test -Xswiftc -warnings-as-errors --skip "/Latency/"
          swift test -Xswiftc -warnings-as-errors --skip-build --filter "/Latency/" --no-parallel

      - name: Lint MawTerminalKit
        working-directory: App/MawTerminalKit
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen

      # SwiftTerm runs a build-tool plugin. Xcode asks once to trust it; in CI the validation
      # is skipped instead.
      - name: Build the app
        working-directory: App
        run: |
          xcodebuild build -project maw.xcodeproj -scheme maw -configuration Debug \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
