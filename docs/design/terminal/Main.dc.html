<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maw v2 main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:#4FC1FF}a:hover{color:#8AD6FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; border: 1px solid #262626; border-radius: 10px; overflow: hidden; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 20px; color: #CFD5E3">

  <div style="height: 38px; flex-shrink: 0; display: flex; align-items: center; padding: 0 14px; background: #0A0A0A; border-bottom: 1px solid #262626">
    <div style="display: flex; gap: 8px; width: 68px; flex-shrink: 0" aria-hidden="true">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
        <button onClick="{{tab.pick}}" style="height: 24px; padding: 0 10px; border: 0; border-radius: 0; background: {{tab.bg}}; color: {{tab.fg}}; font-size: 13px; cursor: pointer; white-space: pre"><span style="color: {{tab.numFg}}">{{tab.num}}</span> {{tab.label}}</button>
      </sc-for>
      <button aria-label="New tab" style="height: 24px; padding: 0 10px; border: 0; background: transparent; color: #8C8C8C; font-size: 13px; cursor: pointer">+</button>
    </div>
    <div style="color: #8C8C8C; white-space: pre">maw</div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; padding: 10px 10px 0; gap: 10px">
    <div style="flex: 3; min-width: 0; position: relative; border: 1px solid #4A4A4A; padding: 12px 14px 10px; box-sizing: border-box">
      <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; color: #CFD5E3; white-space: pre">{{leftLabel}}</div>
      <sc-for list="{{leftLines}}" as="line" hint-placeholder-count="14">
        <div style="height: 20px; white-space: pre; overflow: hidden"><sc-for list="{{line}}" as="seg" hint-placeholder-count="3"><span style="color: {{seg.c}}">{{seg.t}}</span></sc-for></div>
      </sc-for>
      <div style="height: 20px; white-space: pre"><sc-for list="{{leftPrompt}}" as="seg" hint-placeholder-count="3"><span style="color: {{seg.c}}">{{seg.t}}</span></sc-for><span style="display: inline-block; width: 8px; height: 17px; vertical-align: -3px; background: #CFD5E3"></span></div>
    </div>
    <sc-if value="{{showRight}}" hint-placeholder-val="{{ true }}">
      <div style="flex: 2; min-width: 0; position: relative; border: 1px solid #262626; padding: 12px 14px 10px; box-sizing: border-box">
        <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; color: #8C8C8C; white-space: pre">2 ubuntu ~/site</div>
        <sc-for list="{{rightLines}}" as="line" hint-placeholder-count="8">
          <div style="height: 20px; white-space: pre; overflow: hidden"><sc-for list="{{line}}" as="seg" hint-placeholder-count="3"><span style="color: {{seg.c}}">{{seg.t}}</span></sc-for></div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 14px; white-space: pre">
    <sc-for list="{{hints}}" as="h" hint-placeholder-count="5">
      <span><span style="color: #F7CE46">{{h.k}}</span> <span style="color: #8B91A1">{{h.d}}</span></span>
    </sc-for>
    <span style="flex: 1"></span>
    <span style="color: #8C8C8C"><span style="color: #CAE797">●</span> {{status}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 0 };
  }
  renderVals() {
    const tab = this.state.tab;
    // Sampled from the owner's reference theme: keyword #A783F7, variable #E8557C,
    // function #F7CE46, string #CAE797, number #E99173, operator #7AD3D5,
    // comment #5D636F, text #CFD5E3, on #000000.
    const fg = '#CFD5E3', dim = '#5D636F', pink = '#E8557C', peach = '#E99173', gold = '#F7CE46',
      khaki = '#CAE797', teal = '#7AD3D5', lavender = '#A783F7';
    const red = pink, orange = peach, yellow = khaki, green = khaki, blue = lavender, violet = gold;
    // Pink is reserved for problems (errors, modified files); the prompt uses teal and grey.
    const muted = '#8B91A1';
    const p = (host, path, cmd) => [
      { t: 'omer@' + host, c: teal }, { t: ':', c: muted }, { t: path, c: lavender }, { t: '$ ', c: muted }, { t: cmd, c: fg }
    ];
    const txt = (t, c) => [{ t: t, c: c || fg }];
    const defs = [
      { label: 'ubuntu', sub: '~/projects/maw' },
      { label: 'debian', sub: '~' },
      { label: 'zsh', sub: 'mac' }
    ];
    const tabs = defs.map((d, i) => ({
      num: String(i + 1),
      label: d.label + '  ' + d.sub,
      pick: () => this.setState({ tab: i }),
      bg: i === tab ? '#CFD5E3' : 'transparent',
      fg: i === tab ? '#000000' : '#A6A6A6',
      numFg: i === tab ? '#4A4A4A' : '#777777'
    }));
    let leftLines, leftPrompt, leftLabel, status;
    if (tab === 0) {
      const path = '~/projects/maw';
      leftLabel = '1 ubuntu ~/projects/maw';
      leftLines = [
        p('ubuntu', path, 'git status -sb'),
        [{ t: '## ', c: dim }, { t: 'phase/11a-terminal-app', c: violet }, { t: '...', c: dim }, { t: 'origin/phase/11a-terminal-app', c: red }],
        [{ t: ' M ', c: red }, { t: 'App/MawTerminalKit/Sources/Window/TabStrip.swift', c: fg }],
        [{ t: '?? ', c: yellow }, { t: 'App/MawTerminalKit/Sources/Window/KeyHints.swift', c: fg }],
        p('ubuntu', path, 'uname -srm'),
        [{ t: 'Linux ', c: fg }, { t: '6.18.57', c: orange }, { t: '-macwsl aarch64', c: fg }],
        p('ubuntu', path, 'swift test --filter SplitTree'),
        txt('Building for debugging...', dim),
        [{ t: '✔ ', c: green }, { t: 'Test run with ', c: fg }, { t: '14', c: orange }, { t: ' tests in ', c: fg }, { t: '1', c: orange }, { t: ' suite passed after ', c: fg }, { t: '0.012', c: orange }, { t: ' seconds.', c: fg }],
        p('ubuntu', path, 'ls'),
        [{ t: 'App  Guest  Sources  Tests  docs  prompts  ', c: blue }, { t: 'Package.swift  README.md', c: fg }]
      ];
      leftPrompt = p('ubuntu', path, '');
      status = 'ubuntu-24.04 · 412M · :8000 → localhost';
    } else if (tab === 1) {
      leftLabel = '1 debian ~';
      leftLines = [
        p('debian', '~', 'cat /etc/debian_version'),
        txt('13.7', orange),
        p('debian', '~', 'sudo apt update'),
        [{ t: 'Hit:1 ', c: dim }, { t: 'http://deb.debian.org/debian', c: blue }, { t: ' trixie InRelease', c: dim }],
        [{ t: 'All packages are up to date.', c: green }]
      ];
      leftPrompt = p('debian', '~', '');
      status = 'debian-13 · 188M';
    } else {
      const mac = (cmd) => [{ t: 'omer@mbp ', c: teal }, { t: '~ ', c: lavender }, { t: '% ', c: muted }, { t: cmd, c: fg }];
      leftLabel = '1 zsh ~';
      leftLines = [
        mac('maw -l -v'),
        txt('  NAME            STATE      VERSION', dim),
        [{ t: '* ', c: yellow }, { t: 'Ubuntu-24.04    ', c: fg }, { t: 'Running    ', c: green }, { t: '2', c: orange }],
        [{ t: '  Debian-13       ', c: fg }, { t: 'Running    ', c: green }, { t: '2', c: orange }],
        mac('maw -d Debian-13 -- uname -m'),
        txt('aarch64')
      ];
      leftPrompt = mac('');
      status = 'zsh · this mac';
    }
    const rightLines = [
      p('ubuntu', '~/site', 'python3 -m http.server 8000'),
      [{ t: 'Serving HTTP on ', c: fg }, { t: '0.0.0.0', c: orange }, { t: ' port ', c: fg }, { t: '8000', c: orange }, { t: ' ...', c: dim }],
      [{ t: 'maw ', c: violet }, { t: 'forwarded localhost:8000 → ubuntu:8000', c: dim }],
      [{ t: '127.0.0.1 ', c: dim }, { t: '"GET / HTTP/1.1" ', c: yellow }, { t: '200', c: green }],
      [{ t: '127.0.0.1 ', c: dim }, { t: '"GET /app.css HTTP/1.1" ', c: yellow }, { t: '200', c: green }],
      [{ t: '127.0.0.1 ', c: dim }, { t: '"GET /favicon.ico HTTP/1.1" ', c: yellow }, { t: '404', c: red }]
    ];
    return {
      tabs: tabs,
      leftLines: leftLines,
      leftPrompt: leftPrompt,
      leftLabel: leftLabel,
      showRight: tab === 0,
      rightLines: rightLines,
      hints: [
        { k: '⌘T', d: 'tab' },
        { k: '⌘D', d: 'split' },
        { k: '⌘⇧L', d: 'distros' },
        { k: '⌘⇧P', d: 'commands' },
        { k: '⌘,', d: 'settings' }
      ],
      status: status
    };
  }
}
</script>
</body>
</html>
