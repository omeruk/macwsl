<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maw v2 distributions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:#4FC1FF}a:hover{color:#8AD6FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; border: 1px solid #262626; border-radius: 10px; overflow: hidden; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 20px; color: #CFD5E3">

  <div style="height: 38px; flex-shrink: 0; display: flex; align-items: center; padding: 0 14px; background: #0A0A0A; border-bottom: 1px solid #262626">
    <div style="display: flex; gap: 8px; width: 68px" aria-hidden="true">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></div>
    </div>
    <span style="height: 24px; padding: 0 10px; color: #A6A6A6; white-space: pre; display: flex; align-items: center"><span style="color: #777777">1</span> ubuntu  ~/projects/maw</span>
    <span style="height: 24px; padding: 0 10px; background: #CFD5E3; color: #000000; white-space: pre; display: flex; align-items: center">distributions</span>
    <span style="flex: 1"></span>
    <span style="color: #8C8C8C">maw</span>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 10px 0">
    <div style="position: relative; border: 1px solid #4A4A4A; padding: 10px 0 6px">
      <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; white-space: pre">distributions <span style="color: #8C8C8C">({{count}})</span></div>
      <div style="position: absolute; top: -11px; right: 10px; padding: 0 6px; background: #000000; color: #8C8C8C; white-space: pre">16 GB · 10 cores · macOS 27.0</div>
      <div style="display: grid; grid-template-columns: 28px 200px 110px 120px 90px 110px 90px minmax(0, 1fr); padding: 0 14px; height: 24px; align-items: center; color: #8C8C8C; white-space: pre">
        <span></span><span>NAME</span><span>STATE</span><span>MEMORY</span><span>CPU</span><span>DISK</span><span>UPTIME</span><span>KERNEL</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.pick}}" style="display: grid; grid-template-columns: 28px 200px 110px 120px 90px 110px 90px minmax(0, 1fr); width: 100%; padding: 0 14px; height: 26px; align-items: center; border: 0; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; text-align: left; cursor: pointer; white-space: pre">
          <span style="color: {{r.markFg}}">{{r.mark}}</span>
          <span>{{r.name}}</span>
          <span style="color: {{r.stateFg}}">{{r.state}}</span>
          <span style="color: {{r.numFg}}">{{r.mem}}</span>
          <span style="color: {{r.numFg}}">{{r.cpu}}</span>
          <span style="color: {{r.numFg}}">{{r.disk}}</span>
          <span>{{r.up}}</span>
          <span style="color: {{r.dimFg}}">{{r.kernel}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 14px; flex: 1; min-height: 0">
      <div style="flex: 1; position: relative; border: 1px solid #262626; padding: 14px 14px 10px">
        <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; white-space: pre">{{sel.name}}</div>
        <sc-for list="{{details}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; height: 22px; white-space: pre"><span style="width: 150px; color: #8C8C8C">{{d.k}}</span><span style="color: {{d.c}}">{{d.v}}</span></div>
        </sc-for>
      </div>
      <div style="flex: 1; position: relative; border: 1px solid #262626; padding: 14px 14px 10px">
        <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; white-space: pre">memory <span style="color: #8C8C8C">last 60 s</span></div>
        <div style="display: flex; align-items: flex-end; gap: 3px; height: 120px; margin-top: 8px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="40">
            <div style="flex: 1; height: {{b.h}}; background: #A783F7"></div>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 8px; color: #8C8C8C; white-space: pre"><span>60s</span><span><span style="color: #E99173">{{sel.mem}}</span> now · 2.0G limit</span><span>0s</span></div>
      </div>
    </div>
  </div>

  <div style="height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 14px; white-space: pre">
    <sc-for list="{{hints}}" as="h" hint-placeholder-count="7">
      <span><span style="color: #F7CE46">{{h.k}}</span> <span style="color: #8B91A1">{{h.d}}</span></span>
    </sc-for>
    <span style="flex: 1"></span>
    <span><span style="color: #F7CE46">esc</span> <span style="color: #8B91A1">back</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const fg = '#CFD5E3', dim = '#8B91A1', orange = '#E99173', yellow = '#F7CE46', green = '#CAE797', blue = '#A783F7', violet = '#7AD3D5';
    const defs = [
      { name: 'ubuntu-24.04', state: 'running', mem: '412M', cpu: '0.4%', disk: '3.1G/64G', up: '2h 14m', kernel: '6.18.57-macwsl', def: true,
        details: [['default', 'yes', green], ['user', 'omer', fg], ['ip', '192.168.64.3', orange], ['forwarded', 'localhost:8000 → 8000', blue], ['mounts', '/mnt/mac  ← ~', blue], ['disk image', '~/Library/…/ubuntu-24.04/disk.img', fg], ['boot', '271 ms to agent', violet]] },
      { name: 'debian-13', state: 'running', mem: '188M', cpu: '0.0%', disk: '1.4G/64G', up: '41m', kernel: '6.18.57-macwsl', def: false,
        details: [['default', 'no', dim], ['user', 'omer', fg], ['ip', '192.168.64.4', orange], ['forwarded', '—', dim], ['mounts', '/mnt/mac  ← ~', blue], ['disk image', '~/Library/…/debian-13/disk.img', fg], ['boot', '263 ms to agent', violet]] },
      { name: 'alpine-3.22', state: 'stopped', mem: '—', cpu: '—', disk: '0.2G/16G', up: '—', kernel: '6.18.57-macwsl', def: false,
        details: [['default', 'no', dim], ['user', 'root', fg], ['ip', '—', dim], ['forwarded', '—', dim], ['mounts', '/mnt/mac  ← ~', blue], ['disk image', '~/Library/…/alpine-3.22/disk.img', fg], ['boot', '—', dim]] }
    ];
    const s = this.state.sel;
    const rows = defs.map((d, i) => {
      const on = i === s;
      return {
        ...d,
        mark: d.def ? '*' : ' ',
        pick: () => this.setState({ sel: i }),
        bg: on ? '#CFD5E3' : 'transparent',
        fg: on ? '#000000' : fg,
        markFg: on ? '#000000' : yellow,
        stateFg: on ? '#000000' : (d.state === 'running' ? green : dim),
        numFg: on ? '#000000' : orange,
        dimFg: on ? '#4A4A4A' : dim
      };
    });
    const seeds = [4, 5, 5, 6, 7, 7, 8, 8, 9, 12, 18, 22, 21, 19, 16, 14, 13, 12, 12, 11, 11, 12, 14, 18, 26, 34, 38, 36, 30, 24, 20, 18, 17, 16, 16, 15, 15, 16, 17, 17];
    const scale = defs[s].state === 'running' ? (s === 0 ? 2.6 : 1.2) : 0;
    const bars = seeds.map((v) => ({ h: Math.max(2, Math.round(v * scale)) + 'px' }));
    return {
      rows: rows,
      count: defs.length,
      sel: defs[s],
      details: defs[s].details.map((p) => ({ k: p[0], v: p[1], c: p[2] })),
      bars: bars,
      hints: [
        { k: '↩', d: 'shell' },
        { k: 's', d: defs[s].state === 'running' ? 'stop' : 'start' },
        { k: 'r', d: 'restart' },
        { k: 'd', d: 'set default' },
        { k: 'e', d: 'export' },
        { k: 'i', d: 'install…' },
        { k: 'x', d: 'unregister' }
      ]
    };
  }
}
</script>
</body>
</html>
