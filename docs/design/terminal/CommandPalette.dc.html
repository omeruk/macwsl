<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maw v2 command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:#4FC1FF}a:hover{color:#8AD6FF}
button,input{font-family:inherit}
input::placeholder{color:#777777}
</style>
</helmet>
<div style="width: 960px; height: 600px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #000000; border: 1px solid #262626; border-radius: 10px; overflow: hidden; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; line-height: 20px; color: #CFD5E3">
  <div style="height: 38px; flex-shrink: 0; display: flex; align-items: center; padding: 0 14px; background: #0A0A0A; border-bottom: 1px solid #262626">
    <div style="display: flex; gap: 8px; width: 68px" aria-hidden="true">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></div>
    </div>
    <span style="height: 24px; padding: 0 10px; background: #CFD5E3; color: #000000; white-space: pre; display: flex; align-items: center">1 ubuntu  ~/projects/maw</span>
  </div>
  <div style="flex: 1; padding: 22px 24px; white-space: pre; color: #3A3A3A">omer@ubuntu:~/projects/maw$ swift test
✔ Test run with 232 tests in 7 targets passed.
omer@ubuntu:~/projects/maw$ </div>

  <div style="position: absolute; top: 70px; left: 50%; margin-left: -310px; width: 620px; background: #000000; border: 1px solid #4A4A4A; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6)">
    <div style="position: absolute; top: -11px; left: 10px; padding: 0 6px; background: #000000; color: #CFD5E3">commands</div>
    <div style="position: absolute; top: -11px; right: 10px; padding: 0 6px; background: #000000; color: #8C8C8C">{{count}}/{{total}}</div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 6px 14px 0; box-sizing: border-box; border-bottom: 1px solid #262626">
      <span style="color: #F7CE46">&gt;</span>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search commands</span>
      <input value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onKey}}" placeholder="type a command or a distro" style="flex: 1; height: 28px; border: 0; outline: none; background: transparent; color: #CFD5E3; font-size: 13px; caret-color: #CFD5E3">
    </label>
    <div style="padding: 6px 0 8px; max-height: 320px; overflow-y: auto">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <button onMouseEnter="{{r.hover}}" style="display: flex; align-items: center; width: 100%; height: 26px; padding: 0 14px; border: 0; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; text-align: left; cursor: pointer; white-space: pre">
          <span style="width: 92px; flex-shrink: 0; color: {{r.groupFg}}">{{r.group}}</span>
          <span><sc-for list="{{r.parts}}" as="pt" hint-placeholder-count="2"><span style="text-decoration: {{pt.deco}}; font-weight: {{pt.weight}}; color: {{pt.color}}">{{pt.t}}</span></sc-for></span>
          <span style="flex: 1"></span>
          <span style="color: {{r.keyFg}}">{{r.keys}}</span>
        </button>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 10px 14px; color: #8C8C8C">no match</div>
      </sc-if>
    </div>
    <div style="display: flex; gap: 18px; padding: 6px 14px; border-top: 1px solid #262626; white-space: pre">
      <span><span style="color: #F7CE46">↑↓</span> <span style="color: #8B91A1">move</span></span>
      <span><span style="color: #F7CE46">↩</span> <span style="color: #8B91A1">run</span></span>
      <span><span style="color: #F7CE46">esc</span> <span style="color: #8B91A1">close</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: 'sp', selected: 0 };
  }
  renderVals() {
    const all = [
      { group: 'tab', title: 'new tab: ubuntu-24.04', keys: '⌘T' },
      { group: 'tab', title: 'new tab: debian-13', keys: '' },
      { group: 'tab', title: 'new tab: zsh on this mac', keys: '' },
      { group: 'pane', title: 'split pane right', keys: '⌘D' },
      { group: 'pane', title: 'split pane down', keys: '⌘⇧D' },
      { group: 'pane', title: 'equalize panes', keys: '' },
      { group: 'distro', title: 'stop ubuntu-24.04', keys: '' },
      { group: 'distro', title: 'restart debian-13', keys: '' },
      { group: 'distro', title: 'open distributions', keys: '⌘⇧L' },
      { group: 'view', title: 'theme: switch', keys: '' },
      { group: 'view', title: 'font size: increase', keys: '⌘+' },
      { group: 'view', title: 'font size: decrease', keys: '⌘-' }
    ];
    const q = (this.state.query || '').trim().toLowerCase();
    const highlight = (title, on) => {
      const plain = { deco: 'none', weight: '400', color: 'inherit' };
      if (!q) return [{ t: title, ...plain }];
      const i = title.toLowerCase().indexOf(q);
      if (i < 0) return [{ t: title, ...plain }];
      return [
        { t: title.slice(0, i), ...plain },
        { t: title.slice(i, i + q.length), deco: 'underline', weight: '600', color: on ? '#000000' : '#F7CE46' },
        { t: title.slice(i + q.length), ...plain }
      ];
    };
    const filtered = q ? all.filter((c) => c.title.toLowerCase().includes(q) || c.group.includes(q)) : all;
    const selected = Math.min(this.state.selected, Math.max(filtered.length - 1, 0));
    const rows = filtered.map((c, i) => {
      const on = i === selected;
      return {
        group: c.group,
        parts: highlight(c.title, on),
        keys: c.keys,
        bg: on ? '#CFD5E3' : 'transparent',
        fg: on ? '#000000' : '#CFD5E3',
        groupFg: on ? '#4A4A4A' : '#8B91A1',
        keyFg: on ? '#4A4A4A' : '#8B91A1',
        hover: () => this.setState({ selected: i })
      };
    });
    return {
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value, selected: 0 }),
      onKey: (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ selected: Math.min(selected + 1, filtered.length - 1) }); }
        if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ selected: Math.max(selected - 1, 0) }); }
        if (e.key === 'Escape') { this.setState({ query: '', selected: 0 }); }
      },
      rows: rows,
      empty: filtered.length === 0,
      count: filtered.length,
      total: all.length
    };
  }
}
</script>
</body>
</html>
