<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maw new tab menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F12}
a{color:#7AB0F5}a:hover{color:#A9CBFA}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 640px; height: 440px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #16171C; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #E6E8EC">
  <div style="height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; background: #202127; border-bottom: 1px solid rgba(255,255,255,0.07)">
    <div style="display: flex; gap: 8px; padding-right: 10px" aria-hidden="true">
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></div>
      <div style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,0.09); font-size: 13px; font-weight: 500">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #E95420" aria-hidden="true"></span>Ubuntu<span style="color: #8B93A1; font-weight: 400">~</span>
    </div>
    <div style="display: flex; align-items: center; margin-left: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08)">
      <button aria-label="New tab with default distribution" style="width: 30px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #B8BDC6">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12"></line><line x1="2" y1="7" x2="12" y2="7"></line></svg>
      </button>
      <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.10)"></div>
      <button aria-label="Choose distribution for new tab" style="width: 24px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 0 7px 7px 0; background: rgba(255,255,255,0.10); color: #F2F3F5">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="2,3.5 5,6.5 8,3.5"></polyline></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1; padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 20px; opacity: 0.35; white-space: pre"><span style="color: #8BD49C">omer@ubuntu</span><span style="color: #D7DAE0">:</span><span style="color: #7AB0F5">~</span><span style="color: #D7DAE0">$ </span></div>

  <div style="position: absolute; top: 44px; left: 196px; width: 300px; box-sizing: border-box; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: #25262D; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; box-shadow: 0 18px 48px rgba(0,0,0,0.55)">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #8B93A1; padding: 6px 10px 4px">NEW TAB</div>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: {{accent}}; color: #1B1C21; font-size: 13px; font-weight: 500; text-align: left">
      <span style="width: 20px; height: 20px; border-radius: 5px; background: #E95420; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600" aria-hidden="true">U</span>
      Ubuntu 24.04
      <span style="margin-left: auto; font-size: 11px; opacity: 0.75">default</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">⌘1</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <span style="width: 20px; height: 20px; border-radius: 5px; background: #D70A53; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600" aria-hidden="true">D</span>
      Debian 13
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A1">⌘2</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <span style="width: 20px; height: 20px; border-radius: 5px; background: #3A3D45; color: #E6E8EC; display: flex; align-items: center; justify-content: center" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="3,4 6,7 3,10"></polyline><line x1="7.5" y1="10.5" x2="11" y2="10.5"></line></svg>
      </span>
      zsh on this Mac
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A1">⌘3</span>
    </button>
    <div style="height: 1px; margin: 4px 6px; background: rgba(255,255,255,0.08)"></div>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B8BDC6" stroke-width="1.4" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"></rect><line x1="8" y1="3" x2="8" y2="13"></line></svg>
      Split pane right
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A1">⌘D</span>
    </button>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B8BDC6" stroke-width="1.4" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"></rect><line x1="2" y1="8" x2="14" y2="8"></line></svg>
      Split pane down
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A1">⌘⇧D</span>
    </button>
    <div style="height: 1px; margin: 4px 6px; background: rgba(255,255,255,0.08)"></div>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B8BDC6" stroke-width="1.4" aria-hidden="true"><line x1="8" y1="3" x2="8" y2="13"></line><line x1="3" y1="8" x2="13" y2="8"></line></svg>
      Install a distribution…
    </button>
    <button style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #E6E8EC; font-size: 13px; text-align: left">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#B8BDC6" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.25"></circle><path d="M8 1.75v1.5M8 12.75v1.5M14.25 8h-1.5M3.25 8h-1.5M12.4 3.6l-1.06 1.06M4.66 11.34L3.6 12.4M12.4 12.4l-1.06-1.06M4.66 4.66L3.6 3.6"></path></svg>
      Settings
      <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B93A1">⌘,</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F59E5B","options":["#F59E5B","#7AB0F5","#8BD49C","#C792EA"]},"$preview":{"width":640,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F59E5B' };
  }
}
</script>
</body>
</html>
